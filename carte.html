<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>La Carte | Une Semaine sur Deux — Grenoble</title>
  <meta name="description" content="Découvrez la carte d’Une Semaine sur Deux à Grenoble : cuisine française contemporaine, produits de saison et poulpe signature de la maison.">
  <!-- Open Graph / Social Sharing -->
<meta property="og:title" content="La Carte | Une Semaine sur Deux — Grenoble">
<meta property="og:description" content="Découvrez la carte d’Une Semaine sur Deux à Grenoble : cuisine française contemporaine, produits de saison et poulpe signature.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Une Semaine sur Deux">
<meta property="og:locale" content="fr_FR">
<meta property="og:image" content="https://sergewakim.github.io/my-website/og-image.png">
<meta property="og:image:alt" content="Image de partage Une Semaine sur Deux — Restaurant Grenoble">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>

    :root{
      --noir:#0e0a08;
      --noir-soft:#18120d;
      --card:#241911;

      --cream:#f6efe3;
      --cream-dim:#c7b298;

      --gold:#d8aa67;
      --gold-dim:#9f7c4d;

      --line:rgba(216,170,103,0.18);
    }

    *{
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      background:var(--noir);
      color:var(--cream);
      font-family:'Inter',sans-serif;
      -webkit-font-smoothing:antialiased;
    }
      :focus-visible{
        outline:2px solid var(--gold);
        outline-offset:3px;
      }
    .wrap{
      max-width:1120px;
      margin:0 auto;
      padding:0 28px;
    }

    h1,h2,h3{
      margin:0;
      font-family:'Fraunces',serif;
      font-weight:500;
    }

    .eyebrow{
      font-family:'Fraunces',serif;
      font-style:italic;
      color:var(--gold);
      font-size:0.95rem;
    }


    /* ---------- header ---------- */

    header{
      position:fixed;
      top:0;
      left:0;
      right:0;
      z-index:50;

      background:rgba(22,14,13,0.88);
      backdrop-filter:blur(10px);

      border-bottom:1px solid var(--line);
    }

    .nav-inner{
      max-width:1120px;
      margin:0 auto;
      padding:16px 28px;

      display:flex;
      align-items:center;
    }

    .brand{
      display:flex;
      flex-direction:column;

      font-family:'Fraunces',serif;
      font-size:1.05rem;
      line-height:1.05;

      color:var(--cream);
      text-decoration:none;
    }

    .brand small{
      font-family:'Inter',sans-serif;
      font-size:0.6rem;
      letter-spacing:0.18em;
      color:var(--gold-dim);
    }


    /* navigation */

    .main-nav{
      margin-left:120px;
      margin-right:auto;

      width:470px;

      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .main-nav a{
      position:relative;

      padding:8px 0;

      font-size:0.95rem;
      font-weight:500;
      letter-spacing:0.03em;

      color:var(--cream-dim);
      text-decoration:none;

      transition:color .25s ease;
    }

    .main-nav a:hover{
      color:var(--gold);
    }


    /* language */

    .lang-switcher-wrap{
      position:relative;
      margin-left:24px;
    }

    .lang-switcher-wrap::after{
      content:"▾";

      position:absolute;
      right:5px;
      top:50%;

      transform:translateY(-52%);

      color:var(--cream-dim);
      font-size:0.7rem;

      pointer-events:none;
    }

    .lang-switcher{
      width:48px;
      padding:7px 15px 7px 8px;

      appearance:none;
      -webkit-appearance:none;

      background:transparent;
      border:1px solid var(--line);

      font-family:'Inter',sans-serif;
      font-size:0.78rem;
      color:var(--cream-dim);

      cursor:pointer;
    }


    /* ---------- page introduction ---------- */

    .menu-page{
      padding:150px 0 100px;
      min-height:100vh;
    }

    .menu-page-head{
      max-width:650px;
      margin-bottom:70px;
    }

    .menu-page-head h1{
      margin-top:10px;

      font-size:clamp(2.8rem,6vw,4.5rem);
      line-height:1;
    }

    .menu-page-head p{
      max-width:520px;
      margin:22px 0 0;

      color:var(--cream-dim);
      line-height:1.7;
    }
    .menu-columns{
  display:grid;
  grid-template-columns:repeat(3, minmax(0, 1fr));
  gap:0 42px;
  align-items:start;
}

.menu-column{
  min-width:0;
}

.menu-column-head{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:15px;

  padding-bottom:14px;
  margin-bottom:4px;

  border-bottom:1px solid var(--line);
}

.menu-column-head h3{
  font-family:'Fraunces', serif;
  font-size:1.5rem;
  font-weight:500;
  color:var(--cream);
  margin:0;
}

.menu-column-price{
  font-family:'Fraunces', serif;
  font-size:1rem;
  color:var(--gold);
  white-space:nowrap;
}

.menu-dish{
  padding:24px 0;
  border-bottom:1px solid var(--line);
}

.menu-dish-top{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:14px;
}

.menu-dish-name{
  font-family:'Fraunces', serif;
  font-size:1.25rem;
  color:var(--cream);
}

.menu-supplement{
  font-family:'Fraunces', serif;
  font-style:italic;
  font-size:0.9rem;
  color:var(--gold);
  white-space:nowrap;
}

.menu-dish-description{
  display:block;
  margin-top:6px;

  font-family:'Fraunces', serif;
  font-style:italic;
  font-size:0.9rem;
  line-height:1.5;

  color:var(--gold-dim);
}

.menu-formule{
  grid-column:1 / -1;
  width:100%;
  
  margin-top:46px;
  padding:22px 26px;

  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:30px;

  border:1px solid var(--gold-dim);
  background:rgba(216,170,103,0.04);
}

.menu-formule-label{
  font-family:'Fraunces', serif;
  font-size:1.3rem;
  color:var(--cream);
}

.menu-formule-label small{
  display:block;
  margin-bottom:5px;

  font-family:'Inter', sans-serif;
  font-size:0.7rem;
  letter-spacing:0.14em;
  text-transform:uppercase;

  color:var(--gold);
}

.menu-formule-price{
  font-family:'Fraunces', serif;
  font-size:2rem;
  color:var(--gold);
  white-space:nowrap;
}

@media (max-width:880px){
  .menu-columns{
    grid-template-columns:1fr;
    gap:45px;
  }
}

@media (max-width:600px){
  .menu-formule{
    align-items:flex-start;
    flex-direction:column;
    gap:10px;
  }
}

    @media (max-width:880px){

  .nav-inner{
    flex-wrap:wrap;
    padding:12px 20px 10px;
  }

  .brand{
    flex:1 1 auto;
  }

  .lang-switcher-wrap{
    margin-left:auto;
  }

  .main-nav{
    order:3;
    width:100%;
    margin:10px 0 0;
    gap:12px;
    justify-content:space-between;
  }

  .main-nav a{
    font-size:0.78rem;
    padding:6px 0;
    white-space:nowrap;
  }

}

  </style>
</head>


<body>

<header>

  <div class="nav-inner">

    <a href="index.html" class="brand">
      Une Semaine sur Deux
      <small>RESTAURANT · GRENOBLE</small>
    </a>

    <nav class="main-nav">
  <a href="carte.html" data-i18n="nav.menu" aria-current="page">La Carte</a>
  <a href="trouver.html" data-i18n="nav.find">Nous trouver</a>
  <a href="avis-contact.html" data-i18n="nav.reviews">Avis &amp; Contact</a>
</nav>
  

    <div class="lang-switcher-wrap">

      <select
        id="languageSwitcher"
        class="lang-switcher"
        aria-label="Choisir la langue"
      >
        <option value="fr" selected>FR</option>
        <option value="en">EN</option>
      </select>

    </div>

  </div>

</header>


<main class="menu-page">

  <div class="wrap">

    <div class="menu-page-head">

  <div class="eyebrow" data-i18n="menu.eyebrow">
    La Carte
  </div>

  <h1 data-i18n-html="menu.title">
    À découvrir<br>
    en ce moment.
  </h1>

  <p data-i18n="menu.intro">
    Une carte courte qui évolue tous les quinze jours,
    au fil des saisons, des arrivages et de l’inspiration du chef.
  </p>

</div>
<div class="menu-columns reveal" id="menuContainer"></div>
</div>
</main>
<script>

const translations = {

  fr: {
  "nav.menu": "La Carte",
  "nav.find": "Nous trouver",
  "nav.reviews": "Avis & Contact",

  "menu.eyebrow": "La Carte",
  "menu.title": "À découvrir<br>en ce moment.",
  "menu.intro": "Une carte courte qui évolue tous les quinze jours, au fil des saisons, des arrivages et de l’inspiration du chef."
},


  en: {
  "nav.menu": "Menu",
  "nav.find": "Find us",
  "nav.reviews": "Reviews & Contact",

  "menu.eyebrow": "The Menu",
  "menu.title": "On the menu<br>right now.",
  "menu.intro": "A short menu that changes every two weeks, following the seasons, the latest arrivals and the chef’s inspiration."
  }
};
let menuData = null;


function createMenuElement(tag, className, text){

  const element = document.createElement(tag);

  if(className){
    element.className = className;
  }

  if(text !== undefined && text !== null){
    element.textContent = text;
  }

  return element;

}


function renderMenu(lang){

  if(!menuData){
    return;
  }


  const menuContainer =
    document.getElementById("menuContainer");


  menuContainer.innerHTML = "";


  menuData.categories.forEach(category => {

    const column =
      createMenuElement("div", "menu-column");


    const columnHead =
      createMenuElement("div", "menu-column-head");


    const categoryName =
      createMenuElement(
        "h3",
        "",
        category.name[lang]
      );


    const categoryPrice =
      createMenuElement(
        "span",
        "menu-column-price",
        category.price
      );


    columnHead.appendChild(categoryName);
    columnHead.appendChild(categoryPrice);

    column.appendChild(columnHead);


    category.dishes.forEach(dish => {

      const dishElement =
        createMenuElement("div", "menu-dish");


      const dishTop =
        createMenuElement("div", "menu-dish-top");


      const dishName =
        createMenuElement(
          "span",
          "menu-dish-name",
          dish.name[lang]
        );


      dishTop.appendChild(dishName);


      if(dish.supplement){

        const supplement =
          createMenuElement(
            "span",
            "menu-supplement",
            dish.supplement
          );

        dishTop.appendChild(supplement);

      }


      const description =
        createMenuElement(
          "span",
          "menu-dish-description",
          dish.description[lang]
        );


      dishElement.appendChild(dishTop);
      dishElement.appendChild(description);

      column.appendChild(dishElement);

    });


    menuContainer.appendChild(column);

  });


  const formula =
    createMenuElement("div", "menu-formule");


  const formulaLabel =
    createMenuElement("div", "menu-formule-label");


  const formulaSmall =
    createMenuElement(
      "small",
      "",
      menuData.formula.label[lang]
    );


  const formulaDescription =
    createMenuElement(
      "span",
      "",
      menuData.formula.description[lang]
    );


  const formulaPrice =
    createMenuElement(
      "div",
      "menu-formule-price",
      menuData.formula.price
    );


  formulaLabel.appendChild(formulaSmall);
  formulaLabel.appendChild(formulaDescription);

  formula.appendChild(formulaLabel);
  formula.appendChild(formulaPrice);

  menuContainer.appendChild(formula);

}


async function loadMenu(){

  try{

    const response =
      await fetch("menu.json", {
        cache: "no-store"
      });


    if(!response.ok){

      throw new Error(
        `Menu could not be loaded: ${response.status}`
      );

    }


    menuData = await response.json();


    const lang =
      localStorage.getItem("siteLanguage") || "fr";


    renderMenu(lang);

  }
  catch(error){

    console.error(
      "Unable to load menu:",
      error
    );

  }

}

function applyLanguage(lang){

  document.documentElement.lang = lang;

  document.querySelectorAll("[data-i18n]").forEach(element => {

    const key = element.dataset.i18n;

    if(translations[lang][key]){
      element.textContent = translations[lang][key];
    }

  });


  document.querySelectorAll("[data-i18n-html]").forEach(element => {

    const key = element.dataset.i18nHtml;

    if(translations[lang][key]){
      element.innerHTML = translations[lang][key];
    }

  });


  languageSwitcher.value = lang;

  languageSwitcher.setAttribute(
    "aria-label",
    lang === "fr" ? "Choisir la langue" : "Choose language"
  );


  document.title =
  lang === "fr"
    ? "La Carte | Une Semaine sur Deux — Grenoble"
    : "Menu | Une Semaine sur Deux — Grenoble";


  localStorage.setItem("siteLanguage", lang);
renderMenu(lang);
}


const languageSwitcher =
  document.getElementById("languageSwitcher");


const savedLanguage =
  localStorage.getItem("siteLanguage") || "fr";


applyLanguage(savedLanguage);
  
loadMenu();

  languageSwitcher.addEventListener("change", event => {
  applyLanguage(event.target.value);
});

</script>
</body>

</html>
